<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#79c95d" />
  <meta name="description" content="員山走走：宜蘭員山美食、景點、親子去處與 Google Maps 路線規劃。" />
  <meta property="og:title" content="員山走走｜美食景點地圖" />
  <meta property="og:description" content="看地圖、找附近、選行程、自己排路線，一次找齊員山吃喝玩樂。" />
  <meta property="og:type" content="website" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>員山走走｜美食景點地圖</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero" id="top">
    <nav class="topbar shell" aria-label="主要導覽">
      <a class="brand" href="#top" aria-label="回到首頁">
        <span class="brand-mark"><img src="icon.svg" alt="" aria-hidden="true" /></span>
        <span><b>員山走走</b></span>
      </a>
      <div class="top-actions">
        <button class="ghost-btn" id="shareBtn" type="button" aria-label="分享網站">↗</button>
      </div>
    </nav>

    <section class="hero-content shell">
      <p class="eyebrow">宜蘭・員山</p>
      <h1>吃什麼・去哪玩</h1>
      <div class="hero-cta">
        <button class="primary-btn" id="locateBtn" type="button">◎ 使用我的位置</button>
       </div>
    </section>
  </header>

  <main>
    <section class="shell planner-bar" id="explore" aria-label="搜尋與行程設定">
      <div class="search-wrap">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="搜尋美食、景點、咖啡、親子…" autocomplete="off" />
        <button id="clearSearch" class="clear-search" type="button" aria-label="清除搜尋">×</button>
      </div>
      <label class="trip-select-wrap">
        <span>建議行程</span>
        <select id="tripSelect" aria-label="選擇建議行程">
          <option value="">自己排路線</option>
        </select>
      </label>
      <button class="locate-compact" id="nearbyBtn" type="button">📍 離我最近</button>
    </section>

    <section class="shell mobile-tools" aria-label="手機快速操作">
      <button class="mobile-filter-btn" id="mobileFilterBtn" type="button">
        <span>☰ 分類</span><b id="mobileFilterLabel">全部</b>
      </button>
      <div class="mobile-view-switch" role="group" aria-label="切換地圖或列表">
        <button id="mobileMapBtn" type="button">🗺️ 地圖</button>
        <button id="mobileListBtn" class="active" type="button">☰ 列表</button>
      </div>
    </section>

    <section class="shell filter-row" aria-label="地點篩選">
      <div class="chips" id="chips"></div>
      <div class="quick-actions">
        <button class="action-chip" id="familyBtn" type="button">👨‍👩‍👧 親子</button>
        <button class="action-chip" id="rainBtn" type="button">☂ 雨天</button>
        <button class="action-chip" id="freeBtn" type="button">免費</button>
        <button class="action-chip" id="resetBtn" type="button">↺ 重設</button>
      </div>
    </section>

    <section class="shell route-planner" id="routePlanner">
      <div class="route-head">
        <div>
          <h2>我的路線</h2>
        </div>
        <div class="route-actions">
          <button class="text-btn" id="clearRouteBtn" type="button">清空</button>
          <button class="route-open-btn" id="openRouteBtn" type="button" disabled>Google Maps ↗</button>
        </div>
      </div>
      <div class="route-empty" id="routeEmpty">尚未加入地點</div>
      <ol class="route-stops" id="routeStops"></ol>
     </section>

    <section class="shell explore-layout">
      <div class="map-panel">
        <div class="map-head">
          <div><h2>地圖</h2></div>
          <div>
            <p id="mapStatus" class="visually-muted">地圖</p>
            <a id="openGoogleMap" target="_blank" rel="noopener">Google Maps ↗</a>
          </div>
        </div>
        <div class="map-picker-row">
          <label for="mapPlaceSelect">地圖顯示</label>
          <select id="mapPlaceSelect" aria-label="選擇地圖顯示地點"></select>
        </div>
        <div id="map" aria-label="員山 Google 地圖">
          <iframe id="mapFrame" class="mapframe" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="員山 Google 地圖"></iframe>
        </div>
      </div>

      <aside class="list-panel" aria-label="地點列表">
        <div class="list-head">
          <div><h2>地點</h2></div>
          <p id="resultCount">50 個地點</p>
        </div>
        <div class="places-list" id="placesGrid"></div>
        <button class="load-more" id="loadMoreBtn" type="button">顯示更多</button>
      </aside>
    </section>

  </main>

  <dialog id="mobileFilterDialog" class="mobile-filter-dialog">
    <div class="mobile-filter-sheet">
      <div class="mobile-filter-head">
        <div><h2>分類</h2></div>
        <button id="mobileFilterClose" class="mobile-filter-close" type="button" aria-label="關閉">×</button>
      </div>
      <div class="mobile-category-grid" id="mobileCategoryGrid"></div>
      <div class="mobile-filter-subtitle">條件</div>
      <div class="mobile-quick-grid">
        <button type="button" data-mobile-filter="family">👨‍👩‍👧<span>親子</span></button>
        <button type="button" data-mobile-filter="rain">☂<span>雨天</span></button>
        <button type="button" data-mobile-filter="free">$<span>免費</span></button>
        <button type="button" data-mobile-filter="nearby">📍<span>最近</span></button>
      </div>
      <div class="mobile-filter-actions">
        <button id="mobileFilterReset" type="button">重設</button>
        <button id="mobileFilterDone" class="primary" type="button">完成</button>
      </div>
    </div>
  </dialog>

  <footer>
    <div class="shell footer-inner">
      <div><b>員山走走</b><span>宜蘭・員山</span></div>
      <p><a href="https://travel.yilan.gov.tw/zh-tw/district-fun/8/" target="_blank" rel="noopener">資料來源</a> · 2026.09.23</p>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
